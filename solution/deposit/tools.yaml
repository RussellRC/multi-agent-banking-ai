sources:
  deposit:
    type: cloud-sql-mysql
    project: ${CLOUD_SQL_MYSQL_PROJECT}
    region: ${CLOUD_SQL_MYSQL_REGION}
    instance: ${CLOUD_SQL_MYSQL_INSTANCE}
    database: ${CLOUD_SQL_MYSQL_DATABASE}
    user: ${CLOUD_SQL_MYSQL_USER}
    password: ${CLOUD_SQL_MYSQL_PASSWORD}

tools:
  get_balance:
    kind: mysql-sql
    source: deposit
    description: Get the balance of an account
    parameters:
      - name: account_type
        type: string
        description: The type of the account, e.g., vacation, primary
    statement:
      select balance from accounts where customer_id = 1 and account_type = ?;

  get_account_transactions:
    kind: mysql-sql
    source: deposit
    description: Get the all the transactions of an account
    parameters:
      - name: account_type
        type: string
        description: The type of the account
    statement:
      select *
      from transactions
      where
      account_id = (select id from accounts where customer_id = 1 and account_type = ?);
